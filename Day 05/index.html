<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        .row {
            width: 900px;
            height: 200px;
            background-color: red;
            color: white;
            font-size: 100px;
            text-align: center;
            font-weight: bold;
        }

        .col {
            width: 150px;
            height: 200px;
            float: left;
        }

    
    </style>
</head>

<body>
    <div class="row">
        <div style="background-color: green;" class="col">1</div>
        <div style="background-color: yellow; width: 600px;" class="col">2</div>
        <div class="col" style="background-color: blue;">3</div>
    </div>


</body>

</html>
