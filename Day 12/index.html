<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            height: 200px;
            background-color: #eee;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .circle {
            width: 50px;
            height: 50px;
            background-color: #ff7b00;
            border-radius: 50%;
            position: absolute;
            transition: 0.6s;
            top: 50%;
            left: 0;

        }

        .card:hover .circle {
            top: -30px;
            right: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="circle"></div>

    </div>

</body>

</html>
