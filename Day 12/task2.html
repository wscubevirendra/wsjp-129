<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 200px;
            height: 200px;
            background-color: #eee;
            margin: 50px auto;
            position: relative;

        }

        .card {
            width: 50%;
            height: 100%;
            /* border-radius: 10px 10px 0 0; */
            position: absolute;
            top: 0;
            transition: 300ms;
        }

        .card:nth-child(1) {
            background-color: #ff7b00;
            left: -100%;
        }

        .card:nth-child(2) {
            background-color: blueviolet;
            right: -100%;
        }

        .container:hover .card:nth-child(1) {
            left: 0;
        }

          .container:hover .card:nth-child(2) {
            right: 0;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="card"></div>
        <div class="card"></div>

    </div>

</body>

</html>
