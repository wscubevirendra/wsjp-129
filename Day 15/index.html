<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: brown;
            transition: 700ms;
            margin: 100px auto;
            color: white;
            font-size: 50px;

        }

        .box:hover {
            transform: scale(2,3);
        }
    </style>
</head>

<body>

    <div class="box">Box</div>



</body>

</html>
