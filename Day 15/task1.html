<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            height: 300px;
            box-shadow: 0px 0px 2px gray;
            margin: 100px auto;
            position: relative;
            overflow: hidden;

        }

        .overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            background-color: rgba(75, 13, 13, 0.6);
            top: 0;
            left: 0;
            transform: scale(1);
            transition: 1s;
        }

        .card:hover .overlay {
            transform: scale(0) rotate(360deg) skew(300deg);
        }
    </style>
</head>

<body>
    <div class="card">
        <img width="100%" height="100%"
            src="https://assets.myntassets.com/f_webp,w_350,c_limit,fl_progressive,dpr_2.0/assets/images/banners/2018/2/2/11517563866590-lamps.jpg"
            alt="">
        <div class="overlay"></div>


    </div>

</body>

</html>
