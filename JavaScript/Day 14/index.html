<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 900px;
            height: 400px;
            border: 2px double red;
            display: flex;
            margin: 50px auto;
            justify-content: space-around;
            align-items: center;
        }

        .card {
            width: 200px;
            height: 150px;
            border: 2px solid green;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div onclick=" addStyle(this)" class="card">1</div>
        <div onclick=" addStyle(this)" class="card">2</div>
        <div onclick=" addStyle(this)" class="card">3</div>
        <div onclick=" addStyle(this)" class="card">4</div>
    </div>

    <script>


        function addStyle(card) {
            const colors = ["red", "green", "blue", "pink"];
            const cards = document.querySelectorAll(".card");

            cards.forEach((item, index) => {
                item.style = ""
            })

            const num = Math.floor(Math.random() * colors.length);

            card.style.background = colors[num];
        }

    </script>

</body>

</html>
