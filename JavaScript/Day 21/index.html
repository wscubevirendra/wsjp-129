<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #141414;
            color: white;
            min-height: 100vh;
        }

        .navbar-brand {
            color: #e50914 !important;
            font-size: 2rem;
            font-weight: bold;
        }

        .search-section {
            padding: 40px 0;
        }

        .form-control {
            background-color: #222;
            border: 1px solid #333;
            color: white;
        }

        .form-control:focus {
            background-color: #222;
            color: white;
            border-color: #e50914;
            box-shadow: none;
        }

        .btn-netflix {
            background-color: #e50914;
            color: white;
            border: none;
        }

        .btn-netflix:hover {
            background-color: #c40812;
        }

        .movie-card {
            background-color: #1f1f1f;
            border: none;
            overflow: hidden;
            transition: 0.3s;
        }

        .movie-card:hover {
            transform: scale(1.03);
        }

        .movie-card img {
            height: 360px;
            object-fit: cover;
        }

        .card-title {
            color: white;
        }

        .card-text {
            color: #b3b3b3;
        }

        .rating {
            color: #ffc107;
            font-weight: bold;
        }

        .card {
            position: relative;
            overflow: hidden;
        }

        .card-body {
            position: absolute;
            bottom: -100%;
            transition: 400ms;
            /* background-color: white; */

        }

        .card:hover .card-body {
            bottom: 0;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="#">NETFLIX MOVIES</a>
        </div>
    </nav>

    <!-- Search Section -->
    <section class="search-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <input id="inp" type="text" class="form-control" placeholder="Search Movies...">

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Movie Card -->
    <section>
        <div class="container">
            <div id="movieContainer" class="row justify-content-center">

            </div>
        </div>
    </section>

    <script>
        const movieContainer = document.querySelector("#movieContainer");
        const TOP_MOVIES_API = "https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=04c35731a5ee918f014970082a0088b1&page=1";
        const IMGPATH = "https://image.tmdb.org/t/p/w1280";
        const SEARCHAPI = "https://api.themoviedb.org/3/search/movie?&api_key=04c35731a5ee918f014970082a0088b1&query=";
        async function getMovies(API) {
            const response = await fetch(API);
            const data = await response.json()
            showMovies(data.results)
        }

        getMovies(TOP_MOVIES_API)


        function showMovies(movies) {
            movies.forEach((movie, index) => {
                const { title, poster_path, vote_average, overview, release_date } = movie;
                let thumbnail = IMGPATH + poster_path;

                const div = document.createElement("div");
                div.classList.add("col-md-3");
                movieContainer.innerHTML = ""
                div.innerHTML = `
                <div class="card movie-card">

                        <img height="200" src=${thumbnail}
                            alt="Movie Poster">

                        <div class="card-body">
                            <h4 class="card-title">
                                ${title}
                            </h4>

                            <p class="rating">
                                ⭐ ${vote_average} / 10
                            </p>

                            <p class="card-text">
                               ${overview}
                            </p>

                        </div>

                    </div>
                `

                movieContainer.append(div)

            })
        }


        document.querySelector("#inp").addEventListener("keyup", (event) => {
            if (event.target.value === "") {
                getMovies(TOP_MOVIES_API)
            } else {
                getMovies(SEARCHAPI + event.target.value)
            }

        })
    </script>

</body>

</html>
