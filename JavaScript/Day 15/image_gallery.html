<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .lightbox-container {
            max-width: 1000px;
            padding: 20px;
            border: 2px solid red;
            margin: 50px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .card {
            width: calc(25% - 20px);
            height: 200px;
            box-shadow: 0px 2px 2px gray;
            padding: 2px;
        }

        .card img {
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: red;
            /* display: none; */
            transform: scale(0);
            transition: 1s;
        }

        .overlay button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 4px 20px;
            cursor: pointer;
        }

        .overlay img {
            width: 100%;
            height: 100%;
        }

        
    </style>
</head>

<body>
    <div class="lightbox-container">
        <div class="card"><img src="https://picsum.photos/200/200?random=1" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=2" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=3" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=4" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=5" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=6" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=7" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>
        <div class="card"><img src="https://picsum.photos/200/200?random=8" alt=""></div>

    </div>
    <div class="overlay">
        <img src="" alt="">
        <button>X</button>
    </div>

    <script>
        const cards = document.querySelectorAll(".card");
        const overlay = document.querySelector(".overlay");
        const removeBtn = document.querySelector(".overlay button");
        const overlay_image = document.querySelector(".overlay img");

        cards.forEach(
            (card, index) => {
                card.addEventListener("click", (event) => {
                    overlay_image.src = event.target.src;

                    overlay.style.transform = "scale(1)";
                })
            }
        )

        removeBtn.addEventListener("click", (event) => {
            overlay.style = "";
        })


    </script>

</body>

</html>
