<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 1300px;
            padding: 20px;
            background-color: #eee;
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card {
            /* width: calc(25% - 10px); */
            flex: 0 0 calc(25% - 10px);
            padding: 20px;
            border-radius: 20px;
            background-color: #ff7b00;
            color: white;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (width <=1200px) {
            .card {
                /* width: calc(33.33% - 10px); */
                flex: 0 0 calc(33.33% - 10px);

            }
        }

        @media (width <=992px) {
            .card {
                /* width: calc(50% - 10px); */
                flex: 0 0 calc(50% - 10px);

            }
        }

        @media (width <=600px) {
            .card {
                /* width: 100%; */
                flex: 0 0 100%;

            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">4</div>
        <div class="card">4</div>
        <div class="card">4</div>
        <div class="card">4</div>
        <div class="card">4</div>
        <div class="card">4</div>

    </div>

</body>

</html>
