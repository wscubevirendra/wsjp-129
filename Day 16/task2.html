<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .circle {
            width: 300px;
            height: 300px;
            border: 4px solid red;
            margin: 50px auto;
            border-radius: 50%;
            position: relative;
            animation: demo 4s infinite linear;

        }

        .dot {
            width: 30px;
            height: 30px;
            background-color: #ff7b00;
            border-radius: 50%;
            position: absolute;
            top: 60px;

        }

        @keyframes demo {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);

            }

        }
    </style>
</head>

<body>
    <div class="circle">
        <div class="dot"></div>

    </div>
</body>

</html>
