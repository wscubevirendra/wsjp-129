<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: linear-gradient(to bottom, #2980b9, #3498db);
            background-size: cover;
        }

        .main {
            width: 100%;
            height: 100%;
            /* border: 2px solid red; */
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .circle {
            box-shadow: inset 0 0 25px rgba(26, 190, 232, 0.4), inset -5px -10px 35px rgba(255, 255, 255, 0.777);
            /* border-radius: 50%; */
            position: absolute;
            bottom: -40%;
            animation: move infinite alternate linear;

        }

        .circle:nth-child(1) {
            width: 200px;
            height: 200px;
            left: 5%;
            animation-duration: 5s;
        }

        .circle:nth-child(2) {
            width: 100px;
            height: 100px;
            left: 25%;
            animation-duration: 10s;


        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            left: 50%;
            animation-duration: 7s;

        }

        .circle:nth-child(4) {
            width: 50px;
            height: 50px;
            left: 70%;
            animation-duration: 3s;


        }

        .circle:nth-child(5) {
            width: 100px;
            height: 100px;
            left: 90%;
            animation-duration: 4s;

        }

        @keyframes move {
            0% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-200px) rotate(180deg) scale(1);
            }

            80% {
                transform: translateY(-400px) rotate(360deg) scale(0);
                opacity: 0.8;
            }

            100% {
                transform: translateY(-700px) rotate(360deg) scale(1);
               
            }

        }
    </style>
</head>

<body>
    <div class="main">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

    </div>

</body>

</html>
